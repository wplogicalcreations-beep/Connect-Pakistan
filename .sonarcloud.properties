# SonarQube Cloud automatic analysis config.
# Skip bundled third-party libraries, images and the root js/css/assets
# (deployed copies of pak-embassy/public).
sonar.sources=.
sonar.tests=pak-embassy/tests
sonar.exclusions=pak-embassy/tests/**,**/vendor/**,**/node_modules/**,**/storage/**,user-dash-img/**,images/**,img/**,assets/**,js/**,css/*.css,css/user-dashboard-css/**,**/*.min.js,**/jQuery*.js,**/jquery/**,**/bootstrap.js,**/bootstrap.css,**/font-awesome.*,**/ckEditor.js,**/apex-chart.js,pak-embassy/public/images/**,pak-embassy/public/img/**,pak-embassy/public/assets/**
sonar.sourceEncoding=UTF-8
